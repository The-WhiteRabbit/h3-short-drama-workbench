<!doctype html>
<html>
<head><meta charset="utf-8"><title>Tudou Studio Console</title></head>
<body>
<h1>Tudou Studio</h1>
<section id="episodes">Loading episodes...</section>
<section id="shots"></section>
<section id="review"></section>
<script>
async function load(){
 const r=await fetch('/api/project');
 const d=await r.json();
 document.querySelector('#episodes').textContent=JSON.stringify(d.root);
 document.querySelector('#review').textContent=JSON.stringify(d.review||{},null,2);
}
load();
setInterval(load,3000);
</script>
</body>
</html>
