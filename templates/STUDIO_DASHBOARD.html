<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Tudou Production Studio</title>
<style>
body{font-family:Arial;padding:24px;background:#111;color:#eee}
.card{border:1px solid #444;padding:16px;margin:12px 0;border-radius:8px}
video,img{max-width:400px;display:block}
button{margin:4px;padding:8px}
</style>
</head>
<body>
<h1>Tudou Production Studio</h1>
<div id="app">Loading...</div>
<script>
async function load(){
 const r=await fetch('asset_manifest.json');
 const data=await r.json();
 const app=document.getElementById('app');
 app.innerHTML=Object.values(data.assets||{}).map(a=>`
 <div class="card">
 <b>${a.path}</b><br>
 SHA: ${a.sha256}<br>
 Status: ${a.status}
 </div>`).join('');
}
load();
</script>
</body>
</html>
